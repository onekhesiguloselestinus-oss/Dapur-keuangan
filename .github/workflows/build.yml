name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
        pip install --upgrade buildozer cython==0.29.33
    - name: Siapkan Pengaturan Buildozer
      run: |
        yes | buildozer init
        sed -i 's/^source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,csv,txt/' buildozer.spec
        sed -i 's/^# android.permissions = INTERNET/android.permissions = READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE/' buildozer.spec
        sed -i 's/^# android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a, armeabi-v7a/' buildozer.spec
    - name: Build APK
      run: |
        yes | buildozer -v android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: keuangan-apk
        path: bin/*.apk
